name: Increment Counter

on:
  repository_dispatch:
    types: [evs_install]

jobs:
  increment:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Process Event
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime
          
          # Load current data
          try:
            with open('data/installs.json', 'r') as f:
              data = json.load(f)
          except:
            data = {"total_installs": 0, "total_updates": 0, "total_events": 0}
          
          # Update counters
          event_type = "${{ github.event.client_payload.type }}"
          if event_type == "install":
            data["total_installs"] = data.get("total_installs", 0) + 1
          elif event_type == "upgrade":
            data["total_updates"] = data.get("total_updates", 0) + 1
          
          data["total_events"] = data.get("total_events", 0) + 1
          data["updated_at"] = datetime.utcnow().isoformat() + "Z"
          
          with open('data/installs.json', 'w') as f:
            json.dump(data, f, indent=2)
          
          # Update users_or_info.json
          try:
            with open('data/users_or_info.json', 'r') as f:
              users = json.load(f)
          except:
            users = {"events": []}
          
          event = {
            "type": "${{ github.event.client_payload.type }}",
            "device": "${{ github.event.client_payload.device }}",
            "version": "${{ github.event.client_payload.version }}",
            "timestamp": datetime.utcnow().isoformat() + "Z"
          }
          
          users["events"].insert(0, event)
          users["events"] = users["events"][:100]  # Keep last 100
          
          with open('data/users_or_info.json', 'w') as f:
            json.dump(users, f, indent=2)
          EOF
      
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update counters from repository dispatch" || true
          git push
